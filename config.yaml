# ============================================================
# Deskbot 主配置（Mac / Apple Silicon）
# 所有路径相对本文件所在目录（项目根）。
# Jetson Nano 部署请用 config.nano.yaml（--config config.nano.yaml）。
# ============================================================

# 路径
paths:
  root: .                    # 项目根（config.yaml 所在目录）
  models: models
  logs: data/logs
  feedback: data/feedback
  memories: data/memories
  datasets: data/datasets

# 触发方式：wake（唤醒词，免按键）或 keyboard（按 Enter，最稳）
trigger: wake

# 唤醒词（trigger: wake 时生效）
wake:
  keyword: "小桌"                    # 唤醒词；短词命中不稳可改"你好小智"
  model_dir: models/kws/wenetspeech-3.3M   # sherpa-onnx KWS 中文模型
  keywords_file: models/kws/keywords.txt   # pinyin token 关键词表（text2token 生成）
  timeout: 10                       # 唤醒后多久没说话回 idle（s）
  num_threads: 2

# 麦克风/扬声器
audio:
  mic_device: null           # 数字设备名；null 用默认设备
  speaker_device: null
  sample_rate: 16000         # ASR 用 16k mono
  channels: 1
  vad_enabled: true
  barge_in: true             # 抢话打断：说话即停当前 TTS，立即处理新语音
  # 说话前导静音（s）与尾静音（s）：判定一个完整语音片段
  vad_before_silence: 0.3
  vad_after_silence: 0.8
  vad_max_seconds: 20        # 单次语音最长录制时长
  no_speech_timeout: 10      # 唤醒/按键后多久没说话就提示重来（s）

# ASR（sherpa-onnx SenseVoice，中文效果最佳）
asr:
  enabled: true
  engine: sense_voice           # auto / paraformer / sense_voice
  model_dir: models/asr/sense-voice-zh   # 内含 model.int8.onnx / tokens.txt
  num_threads: 4                # M4 多核；SenseVoice 走 onnxruntime CPU

# TTS（sherpa-onnx VITS-zh，多说话人 + FST 数字/日期读准）
tts:
  enabled: true
  model_dir: models/tts/vits-zh-ll   # 多说话人 VITS（音质好）；Mac 上合成快，无需再用 piper
  speaker_id: 0
  speed: 1.0                    # 语速；Mac 合成够快，无需提速补偿
  num_threads: 4                # 合成线程数：M4 上更多线程缩短合成墙钟时间
  enable_fst: true              # 加载 *.fst 规则（date/number/phone/new_heteronym），数字日期读准
  # 多音字静态消歧：把正确注音词条启动时追加进 lexicon（sherpa 无热重载，故一次写入）。
  # 只覆盖"上下文无关"多音字词；lexicon 已有正确词条的（如"音乐"）不需加。
  # piper 无 lexicon 自动跳过。新增词条：ASR 回环验证确认读错后加入。
  polyphone:
    enabled: true
    entries:
      "归还": "ㄏ ㄨ ㄢ ˊ"
      "行李": "ㄒ ㄧ ㄥ ˊ ㄌ ㄧ ˙"
      "还价": "ㄏ ㄨ ㄢ ˊ ㄐ ㄧ ㄚ ˋ"
      "地壳": "ㄉ ㄧ ˋ ㄑ ㄧ ㄠ ˋ"
      "解数": "ㄒ ㄧ ㄝ ˋ ㄕ ㄨ ˋ"
      "亲家": "ㄑ ㄧ ㄥ ˋ ㄐ ㄧ ㄚ ˙"
      "中意": "ㄓ ㄨ ㄥ ˋ ㄧ ˋ"
      "着重": "ㄓ ㄨ ㄛ ˊ ㄓ ㄨ ㄥ ˋ"
      "目的": "ㄇ ㄨ ˋ ㄉ ㄧ ˋ"
      "的确": "ㄉ ㄧ ˊ ㄑ ㄩ ㄝ ˋ"

# LLM 提供方：deepseek（线上 API）或 local（本地 llama-server，回退用）
# provider=deepseek 时用线上模型做生成；本地 llama-server 仍保留做 RAG 嵌入
# （DeepSeek 无嵌入 API），所以 host/port/model 仍需配置。
llm:
  provider: deepseek            # deepseek | local
  api_key_env: DEEPSEEK_API_KEY # provider=deepseek 时从该环境变量读 API key
  api_base: https://api.deepseek.com
  remote_model: deepseek-chat
  # 以下为本地 llama-server（RAG 嵌入用）：
  server_path: /opt/homebrew/bin/llama-server   # Mac 用 Homebrew llama.cpp（自带 Metal）；或 third_party/llama-server.osx-arm64
  # 若换用需要额外动态库的二进制（如 conda 版需 libssl.so.3），在此填目录。
  # 留空 = 清空子进程 LD_LIBRARY_PATH，让二进制用自带 RUNPATH 库（macOS 用 RPATH，此项无实际作用）。
  lib_paths: ""
  model: models/llm/Qwen3-0.6B-Q8_0.gguf    # 仅本地嵌入用（Qwen3-0.6B，1024 维）
  n_gpu_layers: 999            # Metal 全量 offload（-ngl 999）；Nano 用 0 走纯 CPU
  num_threads: 8               # M4 多核
  context_size: 1024           # 仅嵌入用，够用
  max_tokens: 256              # 线上模型可稍长；语音场景仍由 system_prompt 约束 ≤60字
  max_history: 4               # 线上强模型，恢复多轮对话上下文
  first_chunk_max: 8           # 首块小阈值（字）：更小=首声更快（Mac TTS 每块开销可忽略）
  chunk_max: 32                # 无标点硬切阈值（字）：Mac 上长句一次合成更自然
  temperature: 0.7
  host: 127.0.0.1
  port: 8090                   # 与用户已有的 8080 llama-server 隔离
  # 系统提示词（prompt_tuner 可能会追加 learned_rules）
  # 注意：LLM 走线上 DeepSeek，不做"无法联网"约束；实时/网络信息由模型正常作答。
  system_prompt: |
    你是桌面语音助手机器人"小桌"。请直接、简洁地回答用户的问题。回答不超过60字，不用Markdown。

# RAG 个人记忆库
rag:
  enabled: true
  # 嵌入方式：复用本地 llama-server 的 /v1/embeddings（零额外模型）
  # embed_dim 需与本地大模型的 hidden size 一致（Qwen3-0.6B=1024 / Qwen2.5-1.5B=1536 / 0.5B=896）
  embedding_model: llama
  embed_dim: 1024
  top_k: 4                  # 每次问答检索几条记忆
  max_memory_chars: 400     # 拼入 prompt 的记忆总长度上限
  # 每轮对话后抽取记忆
  memory_extract_enabled: true
  memory_collection: deskbot_memories

# 优化闭环
optimize:
  enabled: true
  feedback_keywords_good: ["回答很好", "回答不错", "很好", "答对了", "记住了", "对"]
  feedback_keywords_bad:  ["回答不对", "回答错误", "错了", "不对", "错误", "蠢"]
  memory_keywords:         ["记住", "你要记住", "记住了吗", "我是", "我喜欢", "我叫"]
  # 规则自改进（prompt_tuner）
  prompt_tune_enabled: true
  rules_file: data/rules.yaml
  changelog_file: data/changelog.jsonl
  eval_set: data/datasets/eval_set.jsonl
  eval_report: data/datasets/eval_report.jsonl

# 视觉（M5，可选）
vision:
  enabled: false
  camera_index: 0
  model: models/vision/yolov8n.onnx
  # 检测结果注入 LLM 的开关与阈值
  inject_on_ask: true       # 用户问"桌上有什么"时自动拍照检测
  confidence: 0.35
  num_classes: 80

# 日志
logging:
  level: INFO               # DEBUG 可查看更细流水线日志
  console: true
  file: data/logs/deskbot.log
