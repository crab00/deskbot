[project]
name = "deskbot"
version = "0.1.0"
description = "Jetson Nano 本地语音 AI 桌面机器人：语音问答 + RAG 记忆 + 持续优化"
requires-python = ">=3.8"
dependencies = [
    "numpy>=1.21",
    "PyYAML>=6.0",
    "httpx>=0.24",
    "sounddevice>=0.4.6",
    "sherpa-onnx>=1.13",
    "onnxruntime>=1.14",
    "fastembed>=0.3",
]

[project.optional-dependencies]
vision = ["opencv-python-headless>=4.8"]
dev = ["pytest>=7.0"]
# macOS Apple Silicon（arm64）：不受 Nano py3.8/aarch64 版本锁约束，可升新版
# 需额外 brew install portaudio（sounddevice 依赖 PortAudio）
mac = [
    "numpy>=2.0",
    "onnxruntime>=1.17",
    "sherpa-onnx>=1.13",
    "sounddevice>=0.4.6",
    "opencv-python-headless>=4.8",
]

[tool.setuptools.packages.find]
include = ["deskbot*"]

[project.scripts]
deskbot = "deskbot.main:main"
