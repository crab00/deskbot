[project]
name = "deskbot"
version = "0.1.0"
description = "Jetson Nano 本地语音 AI 桌面机器人：语音问答 + RAG 记忆 + 持续优化"
requires-python = ">=3.8"
dependencies = [
    "numpy>=1.21",
    "PyYAML>=6.0",
    "httpx>=0.24",
    "sounddevice>=0.4.6",
    "sherpa-onnx>=1.10",
    "onnxruntime>=1.14",
    "fastembed>=0.3",
]

[project.optional-dependencies]
vision = ["opencv-python-headless>=4.8"]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
include = ["deskbot*"]

[project.scripts]
deskbot = "deskbot.main:main"
